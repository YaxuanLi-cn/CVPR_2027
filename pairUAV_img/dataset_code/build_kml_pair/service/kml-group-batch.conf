[program:kml-group-batch]
command=/root/pairUAV_img/dataset_code/build_kml_pair/service/run_group_batch.sh
environment=KML_BATCH_START="11",KML_BATCH_END="50"
autostart=false
autorestart=false
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/var/log/kml-group-batch.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
