[program:earth-pro]
command=/usr/bin/prlimit --core=0:0 -- /usr/bin/google-earth-pro
environment=DISPLAY=":1",HOME="/root/pairUAV_img/earth_runtime",XDG_CONFIG_HOME="/root/pairUAV_img/earth_runtime/.config",LIBGL_ALWAYS_SOFTWARE="1",QT_X11_NO_MITSHM="1",LC_ALL="C.UTF-8",QT_ACCESSIBILITY="1"
priority=120
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/earth-pro.log
redirect_stderr=true
